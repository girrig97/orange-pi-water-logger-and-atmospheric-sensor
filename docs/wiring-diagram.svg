<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000" viewBox="0 0 1600 1000">
  <defs>
    <style>
      .title { font: 700 24px Arial, sans-serif; fill: #111827; }
      .label { font: 16px Arial, sans-serif; fill: #111827; }
      .small { font: 13px Arial, sans-serif; fill: #1f2937; }
      .tiny { font: 12px Arial, sans-serif; fill: #374151; }
      .box { fill: #ffffff; stroke: #111827; stroke-width: 2; rx: 10; }
      .module { fill: #f8fafc; stroke: #334155; stroke-width: 2; rx: 10; }
      .note { fill: #fff7ed; stroke: #9a3412; stroke-width: 2; rx: 10; }
      .power5 { stroke: #ef4444; stroke-width: 5; fill: none; }
      .power33 { stroke: #f97316; stroke-width: 4; fill: none; }
      .gnd { stroke: #111827; stroke-width: 5; fill: none; }
      .ctrl { stroke: #16a34a; stroke-width: 4; fill: none; }
      .sda { stroke: #2563eb; stroke-width: 4; fill: none; }
      .scl { stroke: #7c3aed; stroke-width: 4; fill: none; }
      .data { stroke: #15803d; stroke-width: 4; fill: none; }
      .analog { stroke: #f59e0b; stroke-width: 4; fill: none; }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#ffffff"/>
  <text x="40" y="42" class="title">Orange Pi Zero 3 Water Logger Wiring</text>
  <text x="40" y="68" class="small">Corrected wiring: Pico controls load-switch EN only. All grounds are common. Scale analog outputs to 0-3.3V before ADS1115 inputs.</text>

  <rect x="40" y="110" width="210" height="110" class="box"/>
  <text x="68" y="145" class="title">USB Power Bank</text>
  <text x="75" y="180" class="label">5V output</text>
  <text x="75" y="205" class="label">GND</text>

  <rect x="340" y="90" width="230" height="180" class="module"/>
  <text x="374" y="125" class="title">Raspberry Pi Pico / W</text>
  <text x="365" y="160" class="label">VSYS/USB &lt;- 5V</text>
  <text x="365" y="185" class="label">GND -&gt; common GND</text>
  <text x="365" y="210" class="label">GP15 -&gt; load EN</text>
  <text x="365" y="235" class="label">GP14 -&gt; button</text>
  <text x="365" y="260" class="label">GP4/GP5 -&gt; DS3231</text>
  <text x="365" y="285" class="label">GP1/RX &lt;- Orange Pi UART TX</text>

  <rect x="690" y="105" width="230" height="145" class="module"/>
  <text x="722" y="140" class="title">5V Load Switch</text>
  <text x="720" y="175" class="label">IN+ &lt;- bank 5V</text>
  <text x="720" y="200" class="label">IN- &lt;- common GND</text>
  <text x="720" y="225" class="label">EN &lt;- Pico GP15</text>
  <text x="720" y="248" class="label">OUT+ / OUT- to Orange Pi</text>

  <rect x="520" y="360" width="330" height="250" class="module"/>
  <text x="574" y="398" class="title">Orange Pi Zero 3</text>
  <text x="555" y="435" class="label">Pin 2/4 5V &lt;- switched 5V</text>
  <text x="555" y="462" class="label">Pin 6 GND -&gt; common GND</text>
  <text x="555" y="489" class="label">Pin 1 3.3V -&gt; ADC/temp rail</text>
  <text x="555" y="516" class="label">Pin 3 SDA -&gt; ADS1115 SDA</text>
  <text x="555" y="543" class="label">Pin 5 SCL -&gt; ADS1115 SCL</text>
  <text x="555" y="570" class="label">Pin 7 PC9 -&gt; DS18B20 data</text>
  <text x="555" y="597" class="label">UART TX -&gt; Pico GP1/RX</text>

  <rect x="1010" y="320" width="260" height="240" class="module"/>
  <text x="1052" y="355" class="title">ADS1115 #1</text>
  <text x="1065" y="380" class="label">Address 0x48</text>
  <text x="1040" y="410" class="label">VDD &lt;- 3.3V</text>
  <text x="1040" y="435" class="label">GND &lt;- common GND</text>
  <text x="1040" y="460" class="label">SDA/SCL &lt;- I2C3</text>
  <text x="1040" y="485" class="label">ADDR -&gt; GND</text>
  <text x="1040" y="515" class="label">A0 pH, A1 TDS</text>
  <text x="1040" y="540" class="label">A2 turbidity, A3 ORP</text>

  <rect x="1010" y="630" width="260" height="220" class="module"/>
  <text x="1052" y="665" class="title">ADS1115 #2</text>
  <text x="1065" y="690" class="label">Address 0x49</text>
  <text x="1040" y="720" class="label">VDD &lt;- 3.3V</text>
  <text x="1040" y="745" class="label">GND &lt;- common GND</text>
  <text x="1040" y="770" class="label">SDA/SCL &lt;- I2C3</text>
  <text x="1040" y="795" class="label">ADDR -&gt; 3.3V/VDD</text>
  <text x="1040" y="825" class="label">A0 DO, A1 NH4 ISE</text>

  <rect x="80" y="455" width="300" height="170" class="module"/>
  <text x="120" y="492" class="title">DS18B20 Temp Probe</text>
  <text x="110" y="530" class="label">VCC -&gt; Orange Pi 3.3V</text>
  <text x="110" y="557" class="label">GND -&gt; common GND</text>
  <text x="110" y="584" class="label">DATA -&gt; Orange Pi pin 7</text>
  <text x="110" y="611" class="label">4.7k pull-up DATA to 3.3V</text>

  <rect x="1060" y="95" width="430" height="160" class="module"/>
  <text x="1100" y="132" class="title">Pico RTC and Button</text>
  <text x="1100" y="170" class="label">DS3231 VCC -&gt; Pico 3V3</text>
  <text x="1100" y="195" class="label">DS3231 GND -&gt; common GND</text>
  <text x="1100" y="220" class="label">DS3231 SDA/SCL -&gt; Pico GP4/GP5</text>
  <text x="1100" y="245" class="label">Button between Pico GP14 and GND</text>

  <rect x="80" y="660" width="300" height="150" class="module"/>
  <text x="130" y="695" class="title">BME280 Air Sensor</text>
  <text x="110" y="730" class="label">VCC -&gt; Orange Pi 3.3V</text>
  <text x="110" y="755" class="label">GND -&gt; common GND</text>
  <text x="110" y="780" class="label">SDA/SCL -&gt; Orange Pi I2C3</text>
  <text x="110" y="805" class="label">Measures air temp/humidity/pressure</text>

  <rect x="1320" y="330" width="220" height="260" class="module"/>
  <text x="1364" y="365" class="title">Sensor Modules</text>
  <text x="1345" y="405" class="label">pH AO -&gt; ADS1 A0</text>
  <text x="1345" y="435" class="label">TDS AO -&gt; ADS1 A1</text>
  <text x="1345" y="465" class="label">Turb AO -&gt; ADS1 A2</text>
  <text x="1345" y="495" class="label">ORP AO -&gt; ADS1 A3</text>
  <text x="1345" y="525" class="label">DO AO -&gt; ADS2 A0</text>
  <text x="1345" y="555" class="label">NH4 amp AO -&gt; ADS2 A1</text>

  <rect x="1305" y="650" width="250" height="145" class="note"/>
  <text x="1330" y="685" class="title">Important</text>
  <text x="1330" y="720" class="label">ADS1115 inputs must</text>
  <text x="1330" y="745" class="label">stay within 0-3.3V.</text>
  <text x="1330" y="775" class="label">Use voltage dividers if</text>
  <text x="1330" y="800" class="label">sensor AO can reach 5V.</text>

  <path d="M250 155 L340 155" class="power5"/>
  <path d="M250 155 L690 155" class="power5"/>
  <path d="M250 205 L340 185" class="gnd"/>
  <path d="M250 205 L690 200" class="gnd"/>
  <path d="M570 210 L690 225" class="ctrl"/>
  <path d="M920 175 L950 175 L950 405 L520 405" class="power5"/>
  <path d="M920 200 L960 200 L960 462 L520 462" class="gnd"/>
  <path d="M850 489 L1010 410" class="power33"/>
  <path d="M850 489 L1010 720" class="power33"/>
  <path d="M850 516 L1010 460" class="sda"/>
  <path d="M850 516 L1010 770" class="sda"/>
  <path d="M850 543 L1010 460" class="scl"/>
  <path d="M850 543 L1010 770" class="scl"/>
  <path d="M520 570 L380 584" class="data"/>
  <path d="M520 597 L570 285" class="ctrl"/>
  <path d="M520 489 L380 730" class="power33"/>
  <path d="M520 516 L380 780" class="sda"/>
  <path d="M520 543 L380 780" class="scl"/>
  <path d="M1270 515 L1320 405" class="analog"/>
  <path d="M1270 540 L1320 495" class="analog"/>
  <path d="M1270 825 L1320 525" class="analog"/>

  <rect x="70" y="830" width="860" height="110" fill="#f9fafb" stroke="#111827" stroke-width="2" rx="8"/>
  <line x1="100" y1="858" x2="150" y2="858" class="power5"/><text x="165" y="864" class="small">5V</text>
  <line x1="230" y1="858" x2="280" y2="858" class="power33"/><text x="295" y="864" class="small">3.3V</text>
  <line x1="380" y1="858" x2="430" y2="858" class="gnd"/><text x="445" y="864" class="small">GND</text>
  <line x1="530" y1="858" x2="580" y2="858" class="ctrl"/><text x="595" y="864" class="small">Control / GPIO</text>
  <line x1="100" y1="905" x2="150" y2="905" class="sda"/><text x="165" y="911" class="small">I2C SDA</text>
  <line x1="260" y1="905" x2="310" y2="905" class="scl"/><text x="325" y="911" class="small">I2C SCL</text>
  <line x1="430" y1="905" x2="480" y2="905" class="data"/><text x="495" y="911" class="small">1-Wire data</text>
  <line x1="620" y1="905" x2="670" y2="905" class="analog"/><text x="685" y="911" class="small">Analog outputs</text>
</svg>
